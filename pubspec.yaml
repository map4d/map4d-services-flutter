name: map4d_services_dtqg
description: A flutter plugin for integrating Map4D DTQG Services in iOS and Android applications.
version: 0.1.0
homepage: https://map4d.vn

environment:
  sdk: ">=2.14.0 <4.0.0"
  flutter: ">=1.22.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^1.0.0

flutter:
  plugin:
    platforms:
      android:
        package: vn.map4d.services.map4d_services
        pluginClass: Map4dServicesPlugin
      ios:
        pluginClass: Map4dServicesPlugin
